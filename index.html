<!doctype html>
<html lang="en">
  <head>
    <h1>HAPPY BIRTHDAY DADDY</h1>
  </head>
<body>
  <script src="https://jsdelivr.net"></script>
  <button id="confetti-button">¡Celebrar!</button>
  const button = document.getElementById('confetti-button');

button.addEventListener('click', () => {
  confetti({
    particleCount: 100, // Cantidad de partículas
    spread: 70,         // Ángulo de dispersión
    origin: { y: 0.6 }  // Posición en la pantalla (0 es arriba, 1 es abajo)
  });
});
</body>
</html>
